# Builds a SIGNED release APK and uploads it to the Worker as a DRAFT.
# It never publishes: a platform release reviewer publishes the draft on the
# website (Platform administration → Android releases). See README "Releasing".
#
# Runs in the protected `android-release` environment, which holds:
#   secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD, ANDROID_RELEASE_PUBLISHER_TOKEN
#   vars:    FIREBASE_PROJECT_ID, FIREBASE_APP_ID, FIREBASE_API_KEY, FIREBASE_SENDER_ID
#            (optional; empty builds without push)
#            MANIFEST_PUBLIC_KEY_X509_B64, MANIFEST_KEY_ID (optional; unset keeps the
#            production key "k1" pinned in app/build.gradle.kts)
name: Android release (draft upload)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName, e.g. 1.2.0"
        required: true
      version_code:
        description: "versionCode (integer, strictly higher than every earlier upload)"
        required: true
      release_notes:
        description: "What's new (shown on the download page and in the app)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  CHAT_ORIGIN: https://messenger.digitronics.app
  PACKAGE_ID: com.digitronics.chat

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: android-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          INPUT_NAME: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            name="${GITHUB_REF_NAME#v}"
            # vMAJOR.MINOR.PATCH → MAJOR*1000000 + MINOR*1000 + PATCH (monotonic for semver tags)
            if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Tag must be vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}" >&2; exit 1
            fi
            code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
            notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          else
            name="$INPUT_NAME"; code="$INPUT_CODE"; notes="$INPUT_NOTES"
          fi
          [[ "$code" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "Bad versionCode: $code" >&2; exit 1; }
          [[ -n "$name" && ${#name} -le 40 ]] || { echo "Bad versionName" >&2; exit 1; }
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          printf '%s' "$notes" | head -c 4000 > "$RUNNER_TEMP/release-notes.txt"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") asks for the retired `tools`
          # package, which sdkmanager no longer finds; the next step installs
          # exactly what the build needs.
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_B64 is not set" >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          MANIFEST_PUBLIC_KEY_X509_B64: ${{ vars.MANIFEST_PUBLIC_KEY_X509_B64 }}
          MANIFEST_KEY_ID: ${{ vars.MANIFEST_KEY_ID }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --console=plain

      - name: Inspect the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "No signed APK (is signing configured?)" >&2; ls app/build/outputs/apk/release >&2; exit 1; }
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          signer=$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')
          "$bt/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          code=$(sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          name=$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          min_sdk=$(sed -n "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          abis=$(sed -n "s/^native-code: //p" "$RUNNER_TEMP/badging.txt" | tr -d "'" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc . || true)
          [ -n "$abis" ] || abis='[]'
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          [ "$package" = "$PACKAGE_ID" ] || { echo "Package is $package, expected $PACKAGE_ID" >&2; exit 1; }
          [ "$code" = "$VERSION_CODE" ] || { echo "versionCode $code != $VERSION_CODE" >&2; exit 1; }
          [ "$name" = "$VERSION_NAME" ] || { echo "versionName $name != $VERSION_NAME" >&2; exit 1; }
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]] || { echo "Could not read the signer SHA-256" >&2; exit 1; }
          jq -n \
            --arg packageId "$package" --argjson versionCode "$code" --arg versionName "$name" \
            --argjson minSdk "$min_sdk" --argjson abis "$abis" --arg sha256 "$sha" \
            --arg signerSha256 "$signer" --rawfile releaseNotes "$RUNNER_TEMP/release-notes.txt" \
            --arg gitSha "$GITHUB_SHA" \
            '{packageId:$packageId, versionCode:$versionCode, versionName:$versionName, minSdk:$minSdk, abis:$abis, sha256:$sha256, signerSha256:$signerSha256, releaseNotes:$releaseNotes, gitSha:$gitSha}' \
            > "$RUNNER_TEMP/metadata.json"
          cat "$RUNNER_TEMP/metadata.json"
          {
            echo "### Draft candidate"
            echo "- package: \`$package\`, versionName \`$name\`, versionCode \`$code\`, minSdk \`$min_sdk\`"
            echo "- APK SHA-256: \`$sha\`"
            echo "- signer SHA-256: \`$signer\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload as a DRAFT (never published from CI)
        env:
          PUBLISHER_TOKEN: ${{ secrets.ANDROID_RELEASE_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$PUBLISHER_TOKEN" ] || { echo "ANDROID_RELEASE_PUBLISHER_TOKEN is not set" >&2; exit 1; }
          curl --fail-with-body -sS --max-time 600 \
            -X POST "$CHAT_ORIGIN/api/v1/mobile/platform/releases/drafts" \
            -H "Authorization: Bearer $PUBLISHER_TOKEN" \
            -F "metadata=<$RUNNER_TEMP/metadata.json;type=application/json" \
            -F "apk=@app/build/outputs/apk/release/app-release.apk;type=application/vnd.android.package-archive"
          echo
          echo "Draft uploaded. A platform release reviewer publishes it on the website." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
